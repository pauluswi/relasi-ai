<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RELASI AI — Customer CRM</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182333; background: #f3f6fa; }
    body { margin: 0; }
    header { background: #102b46; color: white; padding: 1.2rem max(1.5rem, calc((100vw - 1120px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header p { margin: .3rem 0 0; color: #c9d7e5; }
    header .brand { margin: 0; font-size: 1.4rem; }
    main { max-width: 1120px; margin: 1.8rem auto; padding: 0 1.25rem; }
    .card { background: white; border: 1px solid #dce4ed; border-radius: 12px; padding: 1.25rem; margin: 1rem 0; box-shadow: 0 4px 18px #1a35500b; }
    h2, h3, p { margin-top: 0; }
    h2 { font-size: 1.12rem; }
    h3 { margin-bottom: .7rem; font-size: 1rem; }
    .badge { display: inline-block; border-radius: 99px; padding: .3rem .65rem; color: #17613a; background: #e2f5e9; font-size: .82rem; font-weight: 650; white-space: nowrap; }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(220px, 2fr) auto; align-items: end; gap: .8rem; }
    label { display: block; margin-bottom: .4rem; font-weight: 600; font-size: .9rem; }
    select, input, button { width: 100%; box-sizing: border-box; font: inherit; border: 1px solid #b9c6d4; border-radius: 7px; padding: .65rem .75rem; background: white; color: inherit; }
    button { color: white; background: #126b65; border-color: #126b65; cursor: pointer; font-weight: 600; }
    button:hover { background: #0d5752; }
    .customer-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .7rem; }
    .customer-option { text-align: left; color: #182333; background: #fff; border-color: #dce4ed; }
    .customer-option[aria-current="true"] { border-color: #126b65; box-shadow: 0 0 0 2px #126b6522; }
    .customer-option strong, .customer-option span { display: block; }
    .customer-option span { color: #5b6877; font-size: .84rem; margin-top: .25rem; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .detail-card { border: 1px solid #e1e7ee; border-radius: 9px; padding: 1rem; min-width: 0; }
    .case-record { border-top: 1px solid #e1e7ee; padding: .9rem 0; }
    .case-record:first-of-type { border-top: 0; padding-top: 0; }
    .case-record h4 { margin: 0 0 .35rem; }
    .case-meta { font-size: .84rem; color: #5b6877; margin: .25rem 0; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .form-grid .wide { grid-column: 1 / -1; }
    .form-grid textarea { width: 100%; min-height: 76px; box-sizing: border-box; resize: vertical; font: inherit; border: 1px solid #b9c6d4; border-radius: 7px; padding: .65rem .75rem; }
    .form-actions { display: flex; gap: .5rem; align-items: center; margin-top: .7rem; }
    .form-actions button { width: auto; }
    .inline-form { border-top: 1px solid #e1e7ee; padding-top: .65rem; margin-top: .6rem; }
    .form-message { margin: .5rem 0 0; }
    .profile-heading { display: flex; align-items: start; justify-content: space-between; gap: 1rem; }
    .profile-heading h2 { margin-bottom: .35rem; }
    .muted, .empty { color: #5b6877; line-height: 1.5; }
    dl { display: grid; grid-template-columns: minmax(120px, .8fr) minmax(0, 1.2fr); gap: .5rem .8rem; margin: .8rem 0 0; font-size: .92rem; }
    dt { color: #5b6877; } dd { margin: 0; overflow-wrap: anywhere; font-weight: 550; }
    ul { padding-left: 1.15rem; margin: .4rem 0 0; }
    li { padding: .38rem 0; line-height: 1.4; }
    li small { color: #5b6877; }
    .error { color: #982d2d; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      header { align-items: start; flex-direction: column; }
      .toolbar { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1 class="brand">RELASI AI</h1><p>Customer relationship workspace · Synthetic demo data</p></div>
    <span class="badge" id="health">Checking local runtime…</span>
  </header>
  <main>
    <section class="card">
      <h2>Customer search</h2>
      <div class="toolbar">
        <div>
          <label for="demo-user">Demo identity</label>
          <select id="demo-user"></select>
        </div>
        <div>
          <label for="search">Name, customer ID, or segment</label>
          <input id="search" type="search" placeholder="Search authorized customers" autocomplete="off">
        </div>
        <button id="search-button" type="button">Search</button>
      </div>
      <p class="muted" id="identity-note" style="margin: .8rem 0 0">Local demo identity selector. This is not production authentication.</p>
    </section>
    <section class="card" aria-labelledby="results-title">
      <h2 id="results-title">Customers in your scope</h2>
      <div id="customer-list" class="customer-list"><p class="empty">Loading customers…</p></div>
    </section>
    <section id="customer-detail" class="card" hidden aria-live="polite"></section>
  </main>
  <script>
    const healthBadge = document.querySelector('#health');
    const userSelect = document.querySelector('#demo-user');
    const searchInput = document.querySelector('#search');
    const customerList = document.querySelector('#customer-list');
    const detail = document.querySelector('#customer-detail');
    const demoRoles = {};
    let selectedCustomerId = '';

    async function api(path, options = {}) {
      const headers = { 'X-Demo-User': userSelect.value, ...(options.headers || {}) };
      if (options.body instanceof URLSearchParams) headers['Content-Type'] = 'application/x-www-form-urlencoded';
      const response = await fetch(path, { ...options, headers });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || payload.error || `Request failed (${response.status})`);
      return payload;
    }

    async function loadUsers() {
      const response = await fetch('/api/v1/demo-users');
      const payload = await response.json();
      for (const user of payload.users) demoRoles[user.id] = user.role;
      for (const user of payload.users) {
        const option = document.createElement('option');
        option.value = user.id;
        option.textContent = `${user.displayName} · ${user.role.replaceAll('_', ' ')}`;
        userSelect.append(option);
      }
      await searchCustomers();
    }

    async function searchCustomers() {
      selectedCustomerId = '';
      detail.hidden = true;
      customerList.replaceChildren(document.createTextNode('Loading customers…'));
      try {
        const query = encodeURIComponent(searchInput.value.trim());
        const result = await api(`/api/v1/customers?q=${query}`);
        customerList.replaceChildren();
        if (result.customers.length === 0) {
          customerList.append(makeText('p', 'No customers found in this scope.', 'empty'));
          return;
        }
        for (const customer of result.customers) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'customer-option';
          button.dataset.customerId = customer.id;
          const name = makeText('strong', customer.fullName);
          const summary = makeText('span', `${customer.customerNumber} · ${customer.segment.replaceAll('_', ' ')} · ${customer.city}`);
          button.append(name, summary);
          button.addEventListener('click', () => loadCustomer(customer.id));
          customerList.append(button);
        }
        const first = customerList.querySelector('button');
        if (first) await loadCustomer(first.dataset.customerId);
      } catch (error) {
        customerList.replaceChildren(makeText('p', error.message, 'error'));
      }
    }

    async function loadCustomer(customerId) {
      try {
        const data = await api(`/api/v1/customers/${encodeURIComponent(customerId)}`);
        selectedCustomerId = customerId;
        document.querySelectorAll('.customer-option').forEach(button => {
          button.setAttribute('aria-current', String(button.dataset.customerId === customerId));
        });
        renderCustomer(data);
      } catch (error) {
        detail.hidden = false;
        detail.replaceChildren(makeText('p', error.message, 'error'));
      }
    }

    function renderCustomer(data) {
      detail.replaceChildren();
      detail.hidden = false;
      const customer = data.customer;
      const heading = document.createElement('div');
      heading.className = 'profile-heading';
      const titleBlock = document.createElement('div');
      titleBlock.append(makeText('h2', customer.fullName), makeText('p', `${customer.customerNumber} · ${customer.segment.replaceAll('_', ' ')} · ${customer.city}`, 'muted'));
      heading.append(titleBlock, makeText('span', customer.status, 'badge'));
      detail.append(heading);

      const grid = document.createElement('div');
      grid.className = 'detail-grid';
      grid.append(
        profileCard(customer),
        listCard('Contacts', data.contacts, item => `${item.fullName} · ${item.relationship.replaceAll('_', ' ')} · ${item.preferredChannel.replaceAll('_', ' ')}`),
        listCard('Products', data.products, item => `${item.displayName} · ${item.status} · ${item.maskedReference} · ${formatBalance(item)}`),
        listCard('Recent interactions', data.interactions, item => `${formatDate(item.occurredAt)} · ${item.channel.replaceAll('_', ' ')} · ${item.category} — ${item.summary} (${item.outcome})`),
        caseManagementCard(customer, data.cases),
        interactionFormCard(customer, data.cases)
      );
      detail.append(grid);
    }

    function profileCard(customer) {
      const card = makeText('section', '', 'detail-card');
      card.append(makeText('h3', 'Customer profile'));
      const fields = [
        ['Email', customer.email], ['Mobile', customer.mobile], ['Date of birth', customer.dateOfBirth],
        ['Preferred channel', customer.preferredChannel.replaceAll('_', ' ')], ['Simulated risk', customer.riskIndicator]
      ];
      const list = document.createElement('dl');
      for (const [label, value] of fields) list.append(makeText('dt', label), makeText('dd', value));
      card.append(list);
      return card;
    }

    function listCard(title, items, describe) {
      const card = makeText('section', '', 'detail-card');
      card.append(makeText('h3', title));
      if (!items.length) {
        card.append(makeText('p', 'No records in the demo fixture.', 'empty'));
        return card;
      }
      const list = document.createElement('ul');
      for (const item of items) list.append(makeText('li', describe(item)));
      card.append(list);
      return card;
    }

    function caseManagementCard(customer, cases) {
      const card = makeText('section', '', 'detail-card');
      card.append(makeText('h3', `Service cases (${cases.length})`));
      const role = currentRole();
      const canWrite = ['CUSTOMER_SERVICE_OFFICER', 'CRM_SUPERVISOR', 'CRM_ADMINISTRATOR'].includes(role);
      const canManage = ['CRM_SUPERVISOR', 'CRM_ADMINISTRATOR'].includes(role);
      if (!cases.length) card.append(makeText('p', 'No service cases for this customer.', 'empty'));
      for (const serviceCase of cases) card.append(caseRecord(serviceCase, canWrite, canManage));
      if (canWrite) card.append(caseCreateForm(customer));
      return card;
    }

    function caseRecord(serviceCase, canWrite, canManage) {
      const record = makeText('article', '', 'case-record');
      record.append(makeText('h4', `${serviceCase.reference} · ${serviceCase.subject}`));
      record.append(makeText('p', `${serviceCase.category.replaceAll('_', ' ')} · ${serviceCase.status.replaceAll('_', ' ')} · ${serviceCase.priority} priority`, 'case-meta'));
      record.append(makeText('p', serviceCase.description, 'muted'));
      record.append(makeText('p', `Assigned to ${serviceCase.assignedTo || 'Unassigned'} · SLA ${formatDate(serviceCase.slaDeadline)}${serviceCase.escalated ? ' · Escalated' : ''}${isOverdue(serviceCase) ? ' · OVERDUE' : ''}`, 'case-meta'));
      if (serviceCase.resolution) record.append(makeText('p', `Resolution: ${serviceCase.resolution}`, 'muted'));
      const history = document.createElement('details');
      history.append(makeText('summary', `History (${serviceCase.history.length} events)`));
      const events = document.createElement('ul');
      for (const event of serviceCase.history) events.append(makeText('li', `${formatDate(event.occurredAt)} · ${event.action.replaceAll('_', ' ')} · ${event.details}`));
      history.append(events);
      record.append(history);

      if (canWrite && serviceCase.status !== 'CLOSED') record.append(statusForm(serviceCase));
      if (canManage && !['RESOLVED', 'CLOSED'].includes(serviceCase.status)) {
        const assign = document.createElement('form');
        assign.className = 'inline-form form-actions';
        const assignment = document.createElement('select');
        assignment.name = 'assigneeId';
        assignment.append(option('service-officer', 'Service Officer'));
        const assignButton = makeText('button', 'Assign case');
        assignButton.type = 'submit';
        assign.append(assignment, assignButton);
        assign.addEventListener('submit', event => submitForm(event, `/api/v1/cases/${encodeURIComponent(serviceCase.reference)}/assignment`, 'Case assigned.'));
        record.append(assign);
      }
      if (canManage && isOverdue(serviceCase)) {
        const escalate = makeText('button', 'Escalate overdue case');
        escalate.type = 'button';
        escalate.addEventListener('click', async () => {
          try {
            await api(`/api/v1/cases/${encodeURIComponent(serviceCase.reference)}/escalate`, { method: 'POST', body: new URLSearchParams() });
            await loadCustomer(selectedCustomerId);
          } catch (error) { showMessage(error.message, true); }
        });
        record.append(escalate);
      }
      return record;
    }

    function statusForm(serviceCase) {
      const form = document.createElement('form');
      form.className = 'inline-form form-grid';
      const transitions = {
        OPEN: ['IN_PROGRESS', 'WAITING_FOR_CUSTOMER', 'RESOLVED'],
        IN_PROGRESS: ['WAITING_FOR_CUSTOMER', 'RESOLVED'],
        WAITING_FOR_CUSTOMER: ['IN_PROGRESS', 'RESOLVED'],
        RESOLVED: ['CLOSED', 'IN_PROGRESS']
      };
      const statusField = labeledSelect('Change status', 'status', transitions[serviceCase.status] || []);
      const resolutionField = labeledTextarea('Resolution note (required to resolve)', 'resolution', 2000);
      const resolutionInput = resolutionField.querySelector('textarea');
      resolutionInput.required = false;
      statusField.querySelector('select').addEventListener('change', event => {
        resolutionInput.required = event.target.value === 'RESOLVED';
      });
      resolutionField.className = 'wide';
      const actions = makeText('div', '', 'form-actions wide');
      const save = makeText('button', 'Update case');
      save.type = 'submit';
      actions.append(save);
      form.append(statusField, resolutionField, actions);
      form.addEventListener('submit', event => submitForm(event, `/api/v1/cases/${encodeURIComponent(serviceCase.reference)}/status`, 'Case updated.'));
      return form;
    }

    function caseCreateForm(customer) {
      const form = document.createElement('form');
      form.className = 'inline-form form-grid';
      form.append(makeText('h4', 'Create service case'));
      const categoryField = labeledSelect('Category', 'category', [
        'PAYMENT_COMPLAINT', 'ACCOUNT_INQUIRY', 'LOAN_INQUIRY', 'CARD_ISSUE',
        'MOBILE_BANKING_ISSUE', 'TRANSACTION_DISPUTE', 'GENERAL_BANKING_INQUIRY'
      ]);
      const priorityField = labeledSelect('Priority', 'priority', ['NORMAL', 'HIGH', 'LOW']);
      const subjectField = labeledInput('Subject', 'subject', 120);
      const descriptionField = labeledTextarea('Description', 'description', 2000);
      subjectField.className = 'wide';
      descriptionField.className = 'wide';
      const actions = makeText('div', '', 'form-actions wide');
      const button = makeText('button', 'Create case');
      button.type = 'submit';
      actions.append(button);
      form.append(categoryField, priorityField, subjectField, descriptionField, actions);
      form.addEventListener('submit', event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(form));
        values.customerId = customer.id;
        sendForm('/api/v1/cases', values, 'Case created.');
      });
      return form;
    }

    function interactionFormCard(customer, cases) {
      const card = makeText('section', '', 'detail-card');
      card.append(makeText('h3', 'Record interaction'));
      if (!['CUSTOMER_SERVICE_OFFICER', 'CRM_SUPERVISOR', 'CRM_ADMINISTRATOR'].includes(currentRole())) {
        card.append(makeText('p', 'Interaction recording is available to customer service staff.', 'empty'));
        return card;
      }
      const form = document.createElement('form');
      form.className = 'form-grid';
      const channel = labeledSelect('Channel', 'channel', ['WEB_CHAT', 'EMAIL', 'TELEPHONE', 'BRANCH', 'MOBILE_BANKING']);
      const category = labeledSelect('Category', 'category', ['PAYMENT', 'ACCOUNT', 'LOAN', 'CARD', 'MOBILE_BANKING', 'TRANSACTION', 'GENERAL']);
      const summary = labeledTextarea('Interaction content', 'summary', 2000);
      const outcome = labeledInput('Outcome', 'outcome', 500);
      const related = labeledSelect('Related case (optional)', 'relatedCaseReference', ['']);
      related.querySelector('option').textContent = 'No related case';
      for (const serviceCase of cases) related.querySelector('select').append(option(serviceCase.reference, `${serviceCase.reference} · ${serviceCase.status}`));
      summary.className = 'wide';
      outcome.className = 'wide';
      related.className = 'wide';
      const actions = makeText('div', '', 'form-actions wide');
      const button = makeText('button', 'Save interaction');
      button.type = 'submit';
      actions.append(button);
      form.append(channel, category, summary, outcome, related, actions);
      form.addEventListener('submit', event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(form));
        values.customerId = customer.id;
        sendForm('/api/v1/interactions', values, 'Interaction recorded.');
      });
      card.append(form);
      return card;
    }

    async function submitForm(event, path, successMessage) {
      event.preventDefault();
      await sendForm(path, Object.fromEntries(new FormData(event.currentTarget)), successMessage);
    }

    async function sendForm(path, values, successMessage) {
      try {
        await api(path, { method: 'POST', body: new URLSearchParams(values) });
        await loadCustomer(selectedCustomerId);
        showMessage(successMessage, false);
      } catch (error) { showMessage(error.message, true); }
    }

    function showMessage(message, isError) {
      let status = detail.querySelector('[data-feedback]');
      if (!status) {
        status = makeText('p', '', 'form-message');
        status.dataset.feedback = 'true';
        status.setAttribute('role', 'status');
        detail.prepend(status);
      }
      status.textContent = message;
      status.className = isError ? 'form-message error' : 'form-message muted';
    }

    function currentRole() {
      return demoRoles[userSelect.value] || '';
    }

    function option(value, label) {
      const element = document.createElement('option');
      element.value = value;
      element.textContent = label;
      return element;
    }

    function labeledSelect(labelText, name, values) {
      const wrapper = document.createElement('div');
      const label = makeText('label', labelText);
      const select = document.createElement('select');
      select.name = name;
      for (const value of values) select.append(option(value, value ? value.replaceAll('_', ' ') : ''));
      wrapper.append(label, select);
      return wrapper;
    }

    function labeledInput(labelText, name, maxLength) {
      const wrapper = document.createElement('div');
      const label = makeText('label', labelText);
      const input = document.createElement('input');
      input.name = name;
      input.maxLength = maxLength;
      input.required = true;
      wrapper.append(label, input);
      return wrapper;
    }

    function labeledTextarea(labelText, name, maxLength) {
      const wrapper = document.createElement('div');
      const label = makeText('label', labelText);
      const textarea = document.createElement('textarea');
      textarea.name = name;
      textarea.maxLength = maxLength;
      textarea.required = true;
      wrapper.append(label, textarea);
      return wrapper;
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.valueOf()) ? value : date.toLocaleString();
    }

    function isOverdue(serviceCase) {
      return ['OPEN', 'IN_PROGRESS', 'WAITING_FOR_CUSTOMER'].includes(serviceCase.status)
        && !serviceCase.escalated && new Date(serviceCase.slaDeadline).getTime() < Date.now();
    }

    function formatBalance(product) {
      if (product.availableBalance === 0) return '—';
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: product.currency, maximumFractionDigits: 0 }).format(product.availableBalance);
    }

    function makeText(tag, text, className = '') {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    fetch('/api/v1/health')
      .then(response => response.json())
      .then(data => { healthBadge.textContent = `Local runtime ${data.status} · ${data.mode} mode`; })
      .catch(() => { healthBadge.textContent = 'Local runtime unavailable'; });

    userSelect.addEventListener('change', searchCustomers);
    document.querySelector('#search-button').addEventListener('click', searchCustomers);
    searchInput.addEventListener('keydown', event => { if (event.key === 'Enter') searchCustomers(); });
    loadUsers().catch(error => { customerList.replaceChildren(makeText('p', error.message, 'error')); });
  </script>
</body>
</html>
